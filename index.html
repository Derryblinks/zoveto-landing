<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZOVETO | Veterinary care, connected across Ghana</title>
    <meta
      name="description"
      content="ZOVETO connects farmers, animal keepers, veterinary professionals and veterinary pharmacies in Ghana. Find a verified vet, book a visit and keep animal health records."
    />
    <meta name="theme-color" content="#123b35" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZOVETO | Veterinary care, connected across Ghana" />
    <meta
      property="og:description"
      content="One platform for farmers, animal keepers, veterinary professionals and pharmacies."
    />
    <!-- Sets the light or dark theme before the first paint, so the page never flashes the wrong one. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("zoveto-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
